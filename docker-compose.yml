services:
  # --- PostgreSQL Database ---
  postgres:
    image: postgres:16
    container_name: scibrain_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scibrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scibrain_password}
      POSTGRES_DB: ${POSTGRES_DB:-scibrain}
    ports:
      - "5432:5432"
    volumes:
      - scibrain_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-scibrain} -d ${POSTGRES_DB:-scibrain}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- MongoDB Database ---
  mongodb:
    image: mongo:latest
    container_name: scibrain_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-scibrain}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-scibrain_password}
    ports:
      - "27017:27017"
    volumes:
      - scibrain_mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Qdrant Vector DB ---
  qdrant:
    image: qdrant/qdrant:latest
    container_name: scibrain_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - scibrain_qdrant_storage:/qdrant/storage

  # --- FastAPI Backend ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scibrain_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads

volumes:
  scibrain_postgres_data:
  scibrain_mongo_data:
  scibrain_qdrant_storage: